<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- hyprk: system fontconfig plus the extracted SF fonts (themes/fonts).
     Used by the shell through FONTCONFIG_FILE, nothing is installed system-wide. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/mnt/code/hyprk/themes/fonts</dir>
  <cachedir prefix="xdg">hyprk-fontconfig</cachedir>
</fontconfig>
