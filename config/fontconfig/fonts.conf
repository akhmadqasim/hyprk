<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- hyprk: system fontconfig plus the extracted SF fonts and Apple Color Emoji (themes/fonts, incl. named/).
     Used by the shell through FONTCONFIG_FILE, nothing is installed system-wide. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- relative to this file, so any install prefix works (fontconfig >= 2.13) -->
  <dir prefix="relative">../../themes/fonts</dir>
  <cachedir prefix="xdg">hyprk-fontconfig</cachedir>
  <!-- macOS system fonts for the generic families (SF Pro, New York, SF Mono) -->
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="same"><string>SF Pro</string></edit>
  </match>
  <alias binding="same"><family>sans-serif</family><prefer><family>SF Pro</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>New York</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>SF Mono</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>SF Pro</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>SF Pro</family></prefer></alias>
  <!-- emoji: Apple Color Emoji ahead of Noto Color Emoji. Same rules as emoji.conf (a relative <include> is not resolved here) -->
  <!-- the generic "emoji" family and every emoji font name an app may ask for by name -->
  <match target="pattern">
    <test qual="any" name="family"><string>emoji</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Noto Color Emoji</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Segoe UI Emoji</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Twitter Color Emoji</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Apple Color Emoji</string></edit>
  </match>
  <!-- emoji fallback of the generic families: after the real text fonts, ahead of Noto -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="append" binding="same"><string>Apple Color Emoji</string></edit>
  </match>
  <!-- text rendering like macOS: same rules as macos-text.conf (a relative <include> is not resolved here) -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <!-- colour bitmap fonts (Apple Color Emoji and Noto Color Emoji, CBDT): the bitmaps ARE the glyphs, so embedded bitmaps stay on (off hides them
       in cairo/pango); they are never hinted and scale from the nearest strike -->
  <match target="font">
    <test name="color" compare="eq"><bool>true</bool></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
