# hyprk-managed
# macOS 27 style lock screen for hyprlock 0.9.x (tested against hyprlock 0.9.7 built in /mnt/code/hypr-dev).
# $VARS below are replaced by install.sh (--wallpaper/--avatar); the in-repo defaults point at this checkout.
$WALLPAPER = /mnt/code/hyprk/themes/wallpapers/png/Sonoma Horizon.png
$AVATAR = /mnt/code/hyprk/lockscreen/assets/avatar-default.png
$FONT = System Font
$FONT_ROUNDED = SF Pro Rounded Semibold
$FULLNAME = cmd[update:3600000] getent passwd "$USER" | cut -d: -f5 | cut -d, -f1 | grep . || echo "$USER"

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldColors, 1, 3, ease
    animation = inputFieldWidth, 1, 4, ease
}

# blurred, slightly darkened wallpaper (needs a GPU path that supports hyprlock's blur; without blur it is just the dimmed picture)
background {
    monitor =
    path = $WALLPAPER
    blur_passes = 2
    blur_size = 6
    noise = 0.012
    contrast = 0.95
    brightness = 0.72
    vibrancy = 0.25
    vibrancy_darkness = 0.0
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(255, 255, 255, 0.92)
    font_size = 24
    font_family = $FONT
    position = 0, -92
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
}

# time
label {
    monitor =
    text = cmd[update:1000] date +"%-H:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 118
    font_family = $FONT_ROUNDED
    position = 0, -118
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.30)
}

# user picture, circular
image {
    monitor =
    path = $AVATAR
    size = 96
    rounding = -1
    border_size = 0
    reload_time = -1
    position = 0, 132
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.30)
}

# user name
label {
    monitor =
    text = $FULLNAME
    color = rgba(255, 255, 255, 0.95)
    font_size = 17
    font_family = $FONT
    position = 0, 96
    halign = center
    valign = bottom
}

# password pill
input-field {
    monitor =
    size = 240, 38
    outline_thickness = 1
    rounding = -1
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(255, 255, 255, 0.20)
    outer_color = rgba(255, 255, 255, 0.28)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = $FONT
    check_color = rgba(255, 255, 255, 0.45)
    fail_color = rgba(255, 69, 58, 0.55)
    capslock_color = rgba(255, 159, 10, 0.55)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffb3">Enter Password</span>
    fail_text = <span foreground="##ffffffe6">Incorrect password</span>
    hide_input = false
    position = 0, 40
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.18)
}

