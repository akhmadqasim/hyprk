# hyprk-managed
# macOS 27 style lock screen for hyprlock 0.9.x (tested against hyprlock 0.9.7).
# $VARS below are replaced by install.sh (--wallpaper/--avatar). The in-repo defaults point at the dev checkout;
# packaging/install.sh rewrites them to the install prefix (hyprlock has no relative paths).
$WALLPAPER = /mnt/code/hyprk/themes/wallpapers/png/TahoeLight.png
$AVATAR = /mnt/code/hyprk/lockscreen/assets/avatar-default.png
$STATUS = /mnt/code/hyprk/lockscreen/scripts/status-icon.sh
$STATUS_DIR = /mnt/code/hyprk/lockscreen/assets/status
$FONT = SF Pro
$FONT_ROUNDED = SF Pro Rounded
$FULLNAME = cmd[update:3600000] getent passwd "$USER" | cut -d: -f5 | cut -d, -f1 | grep . || echo "$USER"

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldColors, 1, 3, ease
    animation = inputFieldWidth, 1, 4, ease
}

# the sharp wallpaper, dimmed to 0.95 (macOS 27.2.1 lock: no blur, no zoom; reference/re/LOCKSCREEN-27.2.1.md A1)
background {
    monitor =
    path = $WALLPAPER
    blur_passes = 0
    brightness = 0.95
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# date
label {
    monitor =
    text = cmd[update:60000] printf "<span font_weight='600'>%s</span>" "$(date +"%a %-d %b")"
    color = rgba(255, 255, 255, 0.55)
    font_size = 32
    font_family = $FONT
    position = 0, -98
    halign = center
    valign = top
}

# time
label {
    monitor =
    text = cmd[update:1000] printf "<span font_weight='600'>%s</span>" "$(date +%H:%M)"
    color = rgba(255, 255, 255, 0.42)
    font_size = 156
    font_family = .SF Soft Numeric
    position = 0, -115
    halign = center
    valign = top
}

# user picture, circular
image {
    monitor =
    path = $AVATAR
    size = 55
    rounding = -1
    border_size = 0
    reload_time = -1
    position = 0, 126
    halign = center
    valign = bottom
}

# password pill
input-field {
    monitor =
    size = 161, 28
    outline_thickness = 1
    rounding = -1
    dots_size = 0.18
    dots_spacing = 0.65
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(160, 150, 255, 0.35)
    outer_color = rgba(160, 150, 255, 0.0)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = $FONT
    check_color = rgba(255, 255, 255, 0.45)
    fail_color = rgba(160, 150, 255, 0.35)
    capslock_color = rgba(255, 159, 10, 0.55)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff73" font_size="13pt">Enter Password</span>
    fail_text = 
    hide_input = false
    position = 0, 86
    halign = center
    valign = bottom
}

# status icons, top right (Wi-Fi and battery, picked by scripts/status-icon.sh; empty icon when the hardware is absent)
image {
    monitor =
    path = $STATUS_DIR/none.png
    reload_cmd = $STATUS wifi
    reload_time = 3
    size = 28
    border_size = 0
    position = -59, -8
    halign = right
    valign = top
}

image {
    monitor =
    path = $STATUS_DIR/none.png
    reload_cmd = $STATUS battery
    reload_time = 3
    size = 28
    border_size = 0
    position = -19, -8
    halign = right
    valign = top
}
